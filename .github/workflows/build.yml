name: Build Unity Ads Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Download Godot AAR library
        run: |
          mkdir -p plugin/libs
          wget -q "https://github.com/godotengine/godot/releases/download/4.6-stable/godot-lib.4.6.stable.template_release.aar" \
            -O plugin/libs/godot-lib.4.6.stable.template_release.aar

      - name: Build AAR
        run: gradle :plugin:assembleRelease

      - name: Download Unity Ads from Maven and merge
        run: |
          wget -q "https://repo1.maven.org/maven2/com/unity3d/ads/unity-ads/4.9.2/unity-ads-4.9.2.aar" \
            -O unity-ads.aar
          mkdir -p merged
          unzip -q plugin/build/outputs/aar/plugin-release.aar -d merged/
          unzip -q unity-ads.aar -d unity_extracted/
          cp -rn unity_extracted/. merged/
          cd merged
          zip -r ../UnityAdsPlugin.aar .

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: UnityAdsPlugin
          path: UnityAdsPlugin.aar
